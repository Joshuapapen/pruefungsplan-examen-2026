<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Würfel</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 50% 30%, #334155 0%, #0f172a 70%);
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow: hidden;
  }
  h1 {
    margin: 0 0 6px 0;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .subtitle {
    margin: 0 0 50px 0;
    color: #94a3b8;
    font-size: 14px;
  }

  .scene {
    width: 200px;
    height: 200px;
    perspective: 1000px;
    margin-bottom: 40px;
  }

  .dice {
    width: 200px;
    height: 200px;
    position: relative;
    transform-style: preserve-3d;
    transform: rotateX(-30deg) rotateY(45deg);
    transition: transform 2.6s cubic-bezier(0.2, 0.9, 0.3, 1.05);
  }

  .face {
    position: absolute;
    width: 200px;
    height: 200px;
    background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%);
    border-radius: 22px;
    box-shadow:
      inset 0 0 30px rgba(0, 0, 0, 0.08),
      inset 0 -6px 12px rgba(0, 0, 0, 0.05);
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: 1fr 1fr 1fr;
    padding: 24px;
    gap: 10px;
  }

  .pip {
    background: radial-gradient(circle at 30% 30%, #475569, #0f172a);
    border-radius: 50%;
    width: 32px;
    height: 32px;
    align-self: center;
    justify-self: center;
    box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
  }

  /* Pip-Positionen via grid-area: row col */
  .p-tl { grid-area: 1 / 1; }
  .p-tc { grid-area: 1 / 2; }
  .p-tr { grid-area: 1 / 3; }
  .p-ml { grid-area: 2 / 1; }
  .p-mc { grid-area: 2 / 2; }
  .p-mr { grid-area: 2 / 3; }
  .p-bl { grid-area: 3 / 1; }
  .p-bc { grid-area: 3 / 2; }
  .p-br { grid-area: 3 / 3; }

  /* Würfel-Faces im 3D-Raum */
  .face-1 { transform: translateZ(100px); }
  .face-6 { transform: rotateY(180deg) translateZ(100px); }
  .face-4 { transform: rotateY( 90deg) translateZ(100px); }
  .face-3 { transform: rotateY(-90deg) translateZ(100px); }
  .face-5 { transform: rotateX( 90deg) translateZ(100px); }
  .face-2 { transform: rotateX(-90deg) translateZ(100px); }

  .controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    padding: 14px 32px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.15s, box-shadow 0.2s;
    background: linear-gradient(135deg, #fbbf24, #f59e0b);
    color: #1e293b;
    box-shadow: 0 4px 16px rgba(251, 191, 36, 0.3);
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(251, 191, 36, 0.4); }
  button:active { transform: translateY(0); }
  button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .result {
    margin-top: 30px;
    font-size: 14px;
    color: #94a3b8;
    min-height: 24px;
    text-align: center;
  }
  .result strong {
    color: #fbbf24;
    font-size: 18px;
  }

  .history {
    margin-top: 24px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 400px;
  }
  .history-item {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 14px;
    color: #cbd5e1;
  }
</style>
</head>
<body>

<h1>🎲 Würfel</h1>
<p class="subtitle">Fairer 6-seitiger Würfel</p>

<div class="scene">
  <div class="dice" id="dice">
    <div class="face face-1">
      <div class="pip p-mc"></div>
    </div>
    <div class="face face-2">
      <div class="pip p-tl"></div>
      <div class="pip p-br"></div>
    </div>
    <div class="face face-3">
      <div class="pip p-tl"></div>
      <div class="pip p-mc"></div>
      <div class="pip p-br"></div>
    </div>
    <div class="face face-4">
      <div class="pip p-tl"></div>
      <div class="pip p-tr"></div>
      <div class="pip p-bl"></div>
      <div class="pip p-br"></div>
    </div>
    <div class="face face-5">
      <div class="pip p-tl"></div>
      <div class="pip p-tr"></div>
      <div class="pip p-mc"></div>
      <div class="pip p-bl"></div>
      <div class="pip p-br"></div>
    </div>
    <div class="face face-6">
      <div class="pip p-tl"></div>
      <div class="pip p-tr"></div>
      <div class="pip p-ml"></div>
      <div class="pip p-mr"></div>
      <div class="pip p-bl"></div>
      <div class="pip p-br"></div>
    </div>
  </div>
</div>

<div class="controls">
  <button id="rollBtn">🎲 Würfeln</button>
</div>

<div class="result" id="result">Klick auf „Würfeln" um zu starten</div>
<div class="history" id="history"></div>

<script>
  // Ziel-Rotationen damit das jeweilige Face zur Kamera zeigt
  // Die Default-Position ist rotateX(-30deg) rotateY(45deg) — damit der Würfel hübsch perspektivisch steht
  const FACE_ROTATIONS = {
    1: { x:  -30, y:   45 },
    2: { x:   60, y:   45 },
    3: { x:  -30, y:  -45 },
    4: { x:  -30, y:  135 },
    5: { x: -120, y:   45 },
    6: { x:  -30, y:  225 },
  };

  const dice = document.getElementById("dice");
  const rollBtn = document.getElementById("rollBtn");
  const resultEl = document.getElementById("result");
  const historyEl = document.getElementById("history");
  const history = [];

  // Kumulierte Rotation, damit jeder Wurf vorwärts dreht
  let accX = -30;
  let accY = 45;

  function roll() {
    // Crypto-grade Zufall — wirklich fair 1..6
    const arr = new Uint32Array(1);
    crypto.getRandomValues(arr);
    return (arr[0] % 6) + 1;
  }

  rollBtn.addEventListener("click", () => {
    rollBtn.disabled = true;
    resultEl.innerHTML = "🎲 würfelt...";

    const result = roll();
    const target = FACE_ROTATIONS[result];

    // Mehrere volle Umdrehungen + Zielposition
    const extraSpinsX = 720 + Math.floor(Math.random() * 360);
    const extraSpinsY = 720 + Math.floor(Math.random() * 360);

    accX += extraSpinsX;
    accY += extraSpinsY;

    // Auf das Ziel "snappen" indem wir das nächste Vielfache von 360 nehmen und +Ziel addieren
    accX = Math.round(accX / 360) * 360 + target.x;
    accY = Math.round(accY / 360) * 360 + target.y;

    dice.style.transform = `rotateX(${accX}deg) rotateY(${accY}deg)`;

    setTimeout(() => {
      resultEl.innerHTML = `Ergebnis: <strong>${result}</strong>`;
      history.unshift(result);
      if (history.length > 12) history.pop();
      renderHistory();
      rollBtn.disabled = false;
    }, 2700);
  });

  function renderHistory() {
    historyEl.innerHTML = history.map(n => `<div class="history-item">${n}</div>`).join("");
  }

  // Tastatur: Leertaste zum Würfeln
  document.addEventListener("keydown", (e) => {
    if (e.code === "Space" && !rollBtn.disabled) {
      e.preventDefault();
      rollBtn.click();
    }
  });
</script>

</body>
</html>
