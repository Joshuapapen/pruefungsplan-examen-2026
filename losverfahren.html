<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Losverfahren</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  h1 {
    margin: 0 0 8px 0;
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .subtitle {
    margin: 0 0 40px 0;
    color: #94a3b8;
    font-size: 14px;
  }
  .display {
    width: 100%;
    max-width: 480px;
    height: 200px;
    background: rgba(255, 255, 255, 0.05);
    border: 2px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 64px;
    font-weight: 800;
    letter-spacing: -0.03em;
    transition: border-color 0.3s, transform 0.3s;
    margin-bottom: 30px;
    overflow: hidden;
    position: relative;
  }
  .display.spinning {
    border-color: #fbbf24;
  }
  .display.winner {
    border-color: #22c55e;
    background: rgba(34, 197, 94, 0.15);
    box-shadow: 0 0 60px rgba(34, 197, 94, 0.3);
    transform: scale(1.02);
  }
  .display.idle {
    color: #475569;
    font-size: 24px;
    font-weight: 500;
  }
  .display .name {
    transition: opacity 0.05s;
  }
  .controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    padding: 14px 28px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.15s;
  }
  button:hover { transform: translateY(-1px); }
  button:active { transform: translateY(0); }
  button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .btn-primary {
    background: linear-gradient(135deg, #fbbf24, #f59e0b);
    color: #1e293b;
  }
  .btn-secondary {
    background: rgba(255, 255, 255, 0.1);
    color: white;
  }
  .participants {
    margin-top: 40px;
    width: 100%;
    max-width: 480px;
  }
  .participants h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #64748b;
    margin: 0 0 12px 0;
    text-align: center;
  }
  .participants-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  .participant {
    padding: 12px 16px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: opacity 0.2s, background 0.2s;
  }
  .participant.excluded {
    opacity: 0.3;
    text-decoration: line-through;
  }
  .participant .name { font-weight: 600; }
  .participant .pct { color: #94a3b8; font-size: 13px; font-variant-numeric: tabular-nums; }
  .toggle-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
  }
  .toggle-wrap input { cursor: pointer; }
  .history {
    margin-top: 30px;
    width: 100%;
    max-width: 480px;
    text-align: center;
  }
  .history h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #64748b;
    margin: 0 0 12px 0;
  }
  .history-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
  }
  .history-item {
    background: rgba(255, 255, 255, 0.06);
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 12px;
    color: #cbd5e1;
  }
</style>
</head>
<body>

<h1>🎲 Losverfahren</h1>
<p class="subtitle">Gleiche Chance für alle aktiven Teilnehmenden</p>

<div class="display idle" id="display">Bereit zum Losen</div>

<div class="controls">
  <button class="btn-primary" id="drawBtn">🎲 Losen</button>
  <button class="btn-secondary" id="resetBtn">Verlauf zurücksetzen</button>
</div>

<div class="participants">
  <h2>Teilnehmende</h2>
  <div class="participants-grid" id="participants"></div>
</div>

<div class="history" id="historyWrap" style="display:none">
  <h2>Verlauf</h2>
  <div class="history-list" id="historyList"></div>
</div>

<script>
  const PEOPLE = ["Joshua", "Julia", "Lukas", "Theresa"];
  const STORAGE = "losverfahren_v1";

  let state = loadState();

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE);
      if (raw) return JSON.parse(raw);
    } catch(e) {}
    return { excluded: [], history: [] };
  }
  function saveState() {
    localStorage.setItem(STORAGE, JSON.stringify(state));
  }

  function activeList() {
    return PEOPLE.filter(p => !state.excluded.includes(p));
  }

  function renderParticipants() {
    const container = document.getElementById("participants");
    const active = activeList();
    const pct = active.length ? Math.round(10000 / active.length) / 100 : 0;
    container.innerHTML = PEOPLE.map(name => {
      const excluded = state.excluded.includes(name);
      return `
        <label class="participant ${excluded ? "excluded" : ""}">
          <span class="toggle-wrap">
            <input type="checkbox" data-name="${name}" ${excluded ? "" : "checked"}>
            <span class="name">${name}</span>
          </span>
          <span class="pct">${excluded ? "—" : pct + "%"}</span>
        </label>
      `;
    }).join("");
    container.querySelectorAll("input").forEach(cb => {
      cb.addEventListener("change", () => {
        const n = cb.dataset.name;
        if (cb.checked) {
          state.excluded = state.excluded.filter(x => x !== n);
        } else {
          if (!state.excluded.includes(n)) state.excluded.push(n);
        }
        saveState();
        renderParticipants();
      });
    });
  }

  function renderHistory() {
    const wrap = document.getElementById("historyWrap");
    const list = document.getElementById("historyList");
    if (state.history.length === 0) {
      wrap.style.display = "none";
      return;
    }
    wrap.style.display = "";
    list.innerHTML = state.history.slice(-15).reverse().map(h =>
      `<span class="history-item">${h}</span>`
    ).join("");
  }

  function pickWinner(active) {
    // Crypto-grade Zufall — wirklich fair
    const arr = new Uint32Array(1);
    crypto.getRandomValues(arr);
    return active[arr[0] % active.length];
  }

  async function runDraw() {
    const active = activeList();
    if (active.length === 0) {
      alert("Mindestens eine Person muss aktiv sein!");
      return;
    }
    if (active.length === 1) {
      showWinner(active[0]);
      return;
    }

    const drawBtn = document.getElementById("drawBtn");
    const display = document.getElementById("display");
    drawBtn.disabled = true;
    display.classList.remove("winner", "idle");
    display.classList.add("spinning");
    display.style.fontSize = "64px";
    display.style.color = "white";

    // Spinning-Animation: zufällige Namen mit zunehmender Verzögerung
    const winner = pickWinner(active);
    let elapsed = 0;
    let delay = 50;
    const totalTime = 2200 + Math.random() * 600;

    while (elapsed < totalTime) {
      // Zufälligen Namen anzeigen (rein visuell, hat nichts mit Auswahl zu tun)
      const idx = Math.floor(Math.random() * active.length);
      display.textContent = active[idx];
      await sleep(delay);
      elapsed += delay;
      // Verlangsamung gegen Ende
      delay = Math.min(280, delay * 1.08);
    }

    showWinner(winner);
    state.history.push(winner);
    saveState();
    renderHistory();
    drawBtn.disabled = false;
  }

  function showWinner(name) {
    const display = document.getElementById("display");
    display.classList.remove("spinning", "idle");
    display.classList.add("winner");
    display.textContent = "🎉 " + name;
    confettiBurst();
  }

  function sleep(ms) {
    return new Promise(r => setTimeout(r, ms));
  }

  function confettiBurst() {
    const colors = ["#fbbf24", "#22c55e", "#3b82f6", "#ec4899", "#f97316"];
    for (let i = 0; i < 40; i++) {
      const c = document.createElement("div");
      const size = 6 + Math.random() * 8;
      c.style.cssText = `
        position: fixed;
        left: 50%;
        top: 40%;
        width: ${size}px;
        height: ${size}px;
        background: ${colors[Math.floor(Math.random() * colors.length)]};
        border-radius: ${Math.random() > 0.5 ? "50%" : "2px"};
        pointer-events: none;
        z-index: 9999;
        transition: all 1.2s cubic-bezier(0.2, 0.8, 0.5, 1);
      `;
      document.body.appendChild(c);
      requestAnimationFrame(() => {
        const angle = Math.random() * Math.PI * 2;
        const dist = 150 + Math.random() * 300;
        c.style.transform = `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist + 100}px) rotate(${Math.random() * 720}deg)`;
        c.style.opacity = "0";
      });
      setTimeout(() => c.remove(), 1300);
    }
  }

  document.getElementById("drawBtn").addEventListener("click", runDraw);
  document.getElementById("resetBtn").addEventListener("click", () => {
    if (confirm("Verlauf wirklich zurücksetzen?")) {
      state.history = [];
      saveState();
      renderHistory();
      const display = document.getElementById("display");
      display.classList.remove("winner", "spinning");
      display.classList.add("idle");
      display.textContent = "Bereit zum Losen";
    }
  });

  renderParticipants();
  renderHistory();
</script>

</body>
</html>
