<title>Fakt oder Lüge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: eine Spalte, ein Bildschirm pro Schritt, Gerät wird zwischen zwei Spielern weitergereicht */
:root {
  --bg: #f3f1ee;
  --panel: #ffffff;
  --fg: #1d2330;
  --muted: #667085;
  --line: #d9d6d0;
  --fact: #0f8a6d;
  --fact-bg: #dff3ec;
  --lie: #d9442b;
  --lie-bg: #fbe3dd;
  --accent: #3b4cca;
  --accent-fg: #ffffff;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", sans-serif;
  --font-body: "Figtree", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151d; --panel: #1b202c; --fg: #eef0f5; --muted: #98a1b3; --line: #2c3342;
    --fact: #3ccfa5; --fact-bg: #12332b; --lie: #ff7b5f; --lie-bg: #3a1c16;
    --accent: #8d9bff; --accent-fg: #12151d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151d; --panel: #1b202c; --fg: #eef0f5; --muted: #98a1b3; --line: #2c3342;
  --fact: #3ccfa5; --fact-bg: #12332b; --lie: #ff7b5f; --lie-bg: #3a1c16;
  --accent: #8d9bff; --accent-fg: #12151d; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 17px/1.5 var(--font-body); padding-inline: 16px; padding-block: 20px 40px; }
main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2 { font-family: var(--font-display); font-weight: 800; line-height: 1.1; margin: 0; text-wrap: balance; }
h1 { font-size: 2.4rem; }
h2 { font-size: 1.5rem; }
p { margin: 0; }
.muted { color: var(--muted); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.score { display: flex; gap: 12px; }
.score > div { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.score .on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.score b { font-family: var(--font-display); font-size: 1.8rem; font-variant-numeric: tabular-nums; }
.score span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.statement { font-family: var(--font-display); font-weight: 600; font-size: 1.55rem; line-height: 1.25; text-wrap: balance; }
.label { font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.row > * { flex: 1 1 140px; }
button { font: 600 1.1rem var(--font-body); border: 0; border-radius: 12px; padding: 16px 18px; cursor: pointer; color: var(--fg); background: var(--line); }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button:active { transform: translateY(1px); }
.b-fact { background: var(--fact); color: #fff; }
.b-lie { background: var(--lie); color: #fff; }
.b-main { background: var(--accent); color: var(--accent-fg); }
.b-ghost { background: transparent; border: 1px solid var(--line); }
.dark-on-fact { color: #08241c; }
input[type=text], textarea { font: inherit; width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
textarea { min-height: 96px; resize: vertical; }
.pass { text-align: center; padding-block: 36px; }
.pass h2 span { color: var(--accent); }
.verdict { font-family: var(--font-display); font-weight: 800; font-size: 2rem; }
.v-fact { color: var(--fact); } .v-lie { color: var(--lie); }
.result { display: flex; gap: 12px; flex-wrap: wrap; }
.result > div { flex: 1 1 140px; border-radius: 12px; padding: 12px 14px; font-weight: 600; }
.ok { background: var(--fact-bg); color: var(--fact); }
.no { background: var(--lie-bg); color: var(--lie); }
.expl { border-left: 4px solid var(--line); padding-left: 12px; color: var(--muted); }
.big { font-size: 2.2rem; }
.progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); }
.field { display: flex; flex-direction: column; gap: 6px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

const ROUNDS = 10;
const SEEN_KEY = "fakt-oder-luege-gesehen";
const loadSeen = () => { try { return new Set(JSON.parse(localStorage.getItem(SEEN_KEY) || "[]")); } catch (e) { return new Set(); } };
const saveSeen = set => { try { localStorage.setItem(SEEN_KEY, JSON.stringify([...set])); } catch (e) {} };
/* Neue Aussagen zuerst: schon gespielte kommen erst wieder, wenn weniger als eine Partie ungespielt ist */
function buildDeck() {
  let seen = loadSeen();
  let fresh = FACTS.filter(f => !seen.has(f[0]));
  if (fresh.length < ROUNDS) { seen = new Set(); saveSeen(seen); fresh = FACTS.slice(); }
  return shuffle(fresh);
}
function markSeen(statement) { const s = loadSeen(); s.add(statement); saveSeen(s); }
const app = document.getElementById("app");
const S = { names: ["Joshua", "Luna"], mode: "quiz", scores: [0, 0], round: 0, deck: [], cur: null, picks: [null, null], first: 0, phase: "start", setter: 0 };

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const nm = i => esc(S.names[i]);
const label = v => v ? "Fakt" : "Lüge";

function scoreBar(active) {
  return `<div class="score">${[0, 1].map(i => `<div class="${active === i ? "on" : ""}"><span>${nm(i)}</span><b>${S.scores[i]}</b></div>`).join("")}</div>`;
}
function progress() { return `<div class="progress"><i style="width:${S.round / ROUNDS * 100}%"></i></div>`; }

function start() {
  app.innerHTML = `
    <div><h1>Fakt oder Lüge</h1><p class="muted">Eine Aussage, zwei Spieler. Jeder tippt heimlich, ob sie stimmt. Wer richtig liegt, bekommt einen Punkt.</p></div>
    <div class="card">
      <div class="row">
        <div class="field"><label class="label" for="n0">Spieler 1</label><input type="text" id="n0" value="${nm(0)}" maxlength="16"></div>
        <div class="field"><label class="label" for="n1">Spieler 2</label><input type="text" id="n1" value="${nm(1)}" maxlength="16"></div>
      </div>
      <div class="label">Spielmodus</div>
      <div class="row">
        <button class="b-main" id="m-quiz">Quiz: ${ROUNDS} Aussagen vom Spiel</button>
        <button class="b-main" id="m-own">Duell: ihr denkt euch Aussagen aus</button>
      </div>
      <p class="muted">Gespielt wird auf einem Gerät. Nach jedem Tipp reicht ihr es weiter. Im Duell denkt sich einer eine Aussage aus und legt heimlich fest, ob sie stimmt. Der andere rät. Dann wird getauscht.</p>
    </div>`;
  const go = mode => {
    S.names = [document.getElementById("n0").value.trim() || "Spieler 1", document.getElementById("n1").value.trim() || "Spieler 2"];
    S.mode = mode; S.scores = [0, 0]; S.round = 0; S.first = 0; S.deck = buildDeck(); S.setter = 0;
    mode === "quiz" ? quizPick(0) : ownSet();
  };
  document.getElementById("m-quiz").onclick = () => go("quiz");
  document.getElementById("m-own").onclick = () => go("own");
}

/* ---------- Quiz ---------- */
function quizPick(step) {
  if (step === 0) { S.cur = S.deck[S.round]; S.picks = [null, null]; markSeen(S.cur[0]); }
  const who = step === 0 ? S.first : 1 - S.first;
  app.innerHTML = `
    ${scoreBar(who)}${progress()}
    <div class="card">
      <div class="label">Runde ${S.round + 1} von ${ROUNDS} · ${nm(who)} ist dran</div>
      <p class="statement">${esc(S.cur[0])}</p>
      <div class="row"><button class="b-fact" id="t">Fakt</button><button class="b-lie" id="f">Lüge</button></div>
      <p class="muted">${step === 0 ? "Tippe so, dass " + nm(1 - who) + " nicht mitlesen kann." : "Nicht schummeln: " + nm(1 - who) + " hat schon getippt."}</p>
    </div>`;
  const choose = v => { S.picks[who] = v; step === 0 ? passScreen(1 - who, () => quizPick(1)) : quizReveal(); };
  document.getElementById("t").onclick = () => choose(true);
  document.getElementById("f").onclick = () => choose(false);
}
function passScreen(toIdx, next) {
  app.innerHTML = `<div class="card pass"><div class="big">🔒</div><h2>Gerät an <span>${nm(toIdx)}</span></h2><p class="muted">Die Wahl ist versteckt.</p><button class="b-main" id="go">Ich bin ${nm(toIdx)}, weiter</button></div>`;
  document.getElementById("go").onclick = next;
}
function quizReveal() {
  const truth = S.cur[1];
  const ok = [0, 1].map(i => S.picks[i] === truth);
  ok.forEach((o, i) => { if (o) S.scores[i]++; });
  const last = S.round + 1 >= ROUNDS;
  app.innerHTML = `
    ${scoreBar(-1)}${progress()}
    <div class="card">
      <div class="label">Auflösung</div>
      <p class="statement">${esc(S.cur[0])}</p>
      <div class="verdict ${truth ? "v-fact" : "v-lie"}">${label(truth)}</div>
      <p class="expl">${esc(S.cur[2])}</p>
      <div class="result">${[0, 1].map(i => `<div class="${ok[i] ? "ok" : "no"}">${nm(i)}: ${label(S.picks[i])} ${ok[i] ? "✓ +1" : "✗"}</div>`).join("")}</div>
      <button class="b-main" id="nx">${last ? "Endstand ansehen" : "Nächste Aussage"}</button>
    </div>`;
  document.getElementById("nx").onclick = () => { S.round++; S.first = 1 - S.first; last ? finish() : quizPick(0); };
}

/* ---------- Duell ---------- */
function ownSet() {
  const s = S.setter, g = 1 - s;
  app.innerHTML = `
    ${scoreBar(s)}
    <div class="card">
      <div class="label">Runde ${S.round + 1} · ${nm(s)} denkt sich eine Aussage aus</div>
      <div class="field"><label class="label" for="st">Aussage</label><textarea id="st" placeholder="z. B. Ich war schon einmal in Rom."></textarea></div>
      <div class="label">Stimmt sie wirklich?</div>
      <div class="row"><button class="b-fact" id="t">Ja, Fakt</button><button class="b-lie" id="f">Nein, Lüge</button></div>
      <p class="muted">${nm(g)} schaut weg. Danach rät ${nm(g)}. Liegt ${nm(g)} richtig, gibt es einen Punkt für ${nm(g)}, sonst für ${nm(s)}.</p>
    </div>`;
  const choose = v => {
    const t = document.getElementById("st").value.trim();
    if (!t) { document.getElementById("st").focus(); return; }
    S.cur = [t, v, ""]; passScreen(g, ownGuess);
  };
  document.getElementById("t").onclick = () => choose(true);
  document.getElementById("f").onclick = () => choose(false);
}
function ownGuess() {
  const g = 1 - S.setter;
  app.innerHTML = `
    ${scoreBar(g)}
    <div class="card">
      <div class="label">${nm(g)} rät: Aussage von ${nm(S.setter)}</div>
      <p class="statement">${esc(S.cur[0])}</p>
      <div class="row"><button class="b-fact" id="t">Fakt</button><button class="b-lie" id="f">Lüge</button></div>
    </div>`;
  const choose = v => {
    const right = v === S.cur[1];
    S.scores[right ? g : S.setter]++;
    app.innerHTML = `
      ${scoreBar(-1)}
      <div class="card">
        <div class="label">Auflösung</div>
        <p class="statement">${esc(S.cur[0])}</p>
        <div class="verdict ${S.cur[1] ? "v-fact" : "v-lie"}">${label(S.cur[1])}</div>
        <div class="result"><div class="${right ? "ok" : "no"}">${nm(g)} tippte ${label(v)}: ${right ? "richtig, Punkt für " + nm(g) : "falsch, Punkt für " + nm(S.setter)}</div></div>
        <div class="row"><button class="b-main" id="nx">Weiter, ${nm(g)} ist dran</button><button class="b-ghost" id="end">Spiel beenden</button></div>
      </div>`;
    document.getElementById("nx").onclick = () => { S.round++; S.setter = g; ownSet(); };
    document.getElementById("end").onclick = finish;
  };
  document.getElementById("t").onclick = () => choose(true);
  document.getElementById("f").onclick = () => choose(false);
}

/* ---------- Ende ---------- */
function finish() {
  const [a, b] = S.scores;
  const title = a === b ? "Unentschieden" : `${nm(a > b ? 0 : 1)} gewinnt`;
  app.innerHTML = `
    <div class="card pass">
      <div class="big">🏆</div>
      <h1>${title}</h1>
      <p class="muted">${nm(0)} ${a} : ${b} ${nm(1)}</p>
      <div class="row"><button class="b-main" id="again">Revanche</button><button class="b-ghost" id="menu">Zum Start</button></div>
    </div>`;
  document.getElementById("again").onclick = () => {
    S.scores = [0, 0]; S.round = 0; S.deck = buildDeck(); S.first = 0; S.setter = 0;
    S.mode === "quiz" ? quizPick(0) : ownSet();
  };
  document.getElementById("menu").onclick = start;
}

start();
</script>
